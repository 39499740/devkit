<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F5F7" />
    <title>当前离线 · DevKit</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --border: #e4e7ec;
        --text-primary: #12161f;
        --text-secondary: #5a6472;
        --text-tertiary: #8b94a3;
        --accent: #2563eb;
        --warn: #d97706;
        --warn-soft: #fef4e6;
        --radius: 8px;
        --font-ui: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --surface: #161a21;
          --border: #272f3b;
          --text-primary: #e9edf3;
          --text-secondary: #9fa9b8;
          --text-tertiary: #6c7686;
          --accent: #4d8dff;
          --warn: #f0a94a;
          --warn-soft: #2b2114;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: var(--font-ui);
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-primary);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 32px 28px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin-bottom: 12px;
        font-size: 20px;
        color: var(--warn);
        background: var(--warn-soft);
        border-radius: 12px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      p {
        margin: 8px 0 0;
        color: var(--text-secondary);
      }
      .note {
        margin-top: 14px;
        padding: 12px 14px;
        font-size: 12.5px;
        text-align: left;
        color: var(--text-secondary);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .note strong {
        color: var(--text-primary);
        font-weight: 600;
      }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 500;
        color: #ffffff;
        background: var(--accent);
        border: none;
        border-radius: 7px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .state {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-tertiary);
      }
      a {
        color: var(--accent);
      }
      .links {
        margin-top: 16px;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge" aria-hidden="true">⚑</span>
      <h1>无法加载该页面</h1>
      <p>当前处于离线状态，且这个页面尚未缓存到本机。</p>
      <div class="note">
        <strong>首次访问需要网络，当前无法加载。</strong>
        页面脚本与样式必须至少在线加载一次，Service Worker
        才能把它缓存下来供离线访问。此页不会显示旧结果，也不会给出猜测内容。
      </div>
      <button id="retry" type="button">重试加载</button>
      <p class="state" id="state">正在检测网络状态…</p>
      <p class="links">
        已缓存的页面仍可离线打开。查看缓存状态：<a href="/offline">离线说明</a>
      </p>
    </main>
    <script>
      ;(function () {
        var state = document.getElementById('state')
        var retry = document.getElementById('retry')
        retry.addEventListener('click', function () {
          location.reload()
        })
        try {
          state.textContent = navigator.onLine
            ? '浏览器报告网络可用，但仍无法从缓存命中该页面，可重试加载。'
            : '浏览器报告网络不可用，请恢复网络后重试，或先打开已缓存的页面。'
        } catch (_) {
          state.textContent = '无法读取浏览器网络状态，可重试加载。'
        }
        window.addEventListener('online', function () {
          state.textContent = '网络已恢复，可重试加载该页面。'
        })
        window.addEventListener('offline', function () {
          state.textContent = '浏览器报告网络不可用，请恢复网络后重试。'
        })
      })()
    </script>
  </body>
</html>
